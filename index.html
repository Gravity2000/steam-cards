html<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam 卡牌价格监控</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1b2838; color: #c6d4df; min-height: 100vh; }
        .header { background: #171a21; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #66c0f4; font-size: 20px; }
        .header-right { display: flex; gap: 12px; align-items: center; }
        .container { max-width: 900px; margin: 32px auto; padding: 0 16px; }
        .auth-box { background: #2a3f5f; border-radius: 8px; padding: 32px; max-width: 400px; margin: 80px auto; }
        .auth-box h2 { color: #66c0f4; margin-bottom: 24px; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; background: #1b2838; border: 1px solid #4a7a9b; border-radius: 4px; color: #c6d4df; font-size: 14px; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #66c0f4; color: #1b2838; font-weight: bold; }
        .btn-primary:hover { background: #4fa3d4; }
        .btn-danger { background: #c94f4f; color: white; }
        .btn-danger:hover { background: #a33; }
        .btn-secondary { background: #4a7a9b; color: white; }
        .btn-secondary:hover { background: #3a6a8b; }
        .btn-logout { background: transparent; color: #c6d4df; border: 1px solid #4a7a9b; }
        .card-list { display: grid; gap: 16px; }
        .card-item { background: #2a3f5f; border-radius: 8px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .card-info h3 { color: #66c0f4; margin-bottom: 8px; }
        .card-info p { font-size: 14px; color: #8f98a0; margin-bottom: 4px; }
        .card-price { font-size: 24px; color: #4caf50; font-weight: bold; }
        .card-actions { display: flex; gap: 8px; align-items: center; flex-direction: column; }
        .alert-input { display: flex; gap: 8px; }
        .alert-input input { margin: 0; width: 150px; }
        .add-box { background: #2a3f5f; border-radius: 8px; padding: 20px; margin-bottom: 24px; display: flex; gap: 12px; }
        .add-box input { margin: 0; flex: 1; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .message { padding: 10px 16px; border-radius: 4px; margin-bottom: 16px; display: none; }
        .message.success { background: #1a3a2a; color: #4caf50; display: block; }
        .message.error { background: #3a1a1a; color: #f44336; display: block; }
        .auth-switch { text-align: center; margin-top: 16px; font-size: 14px; color: #8f98a0; }
        .auth-switch a { color: #66c0f4; cursor: pointer; }
        .username-display { color: #66c0f4; font-size: 14px; }
    </style>
</head>
<body>

<div class="header">
    <h1>🎴 Steam 卡牌价格监控</h1>
    <div class="header-right">
        <span class="username-display" id="usernameDisplay"></span>
        <button class="btn-logout" id="logoutBtn" style="display:none" onclick="logout()">退出登录</button>
    </div>
</div>

<!-- 登录/注册界面 -->
<div id="authPage">
    <div class="auth-box">
        <h2 id="authTitle">登录</h2>
        <div id="message" class="message"></div>
        <input type="text" id="username" placeholder="用户名">
        <input type="password" id="password" placeholder="密码">
        <input type="email" id="email" placeholder="邮箱（用于价格提醒）" style="display:none">
        <button class="btn-primary" style="width:100%" onclick="submitAuth()">登录</button>
        <div class="auth-switch">
            <span id="authSwitchText">没有账号？</span>
            <a onclick="toggleAuth()">注册</a>
        </div>
    </div>
</div>

<!-- 主界面 -->
<div id="mainPage" style="display:none">
    <div class="container">
        <div id="mainMessage" class="message"></div>

        <div class="add-box">
            <input type="text" id="cardName" placeholder="输入卡牌名称（例如：2600700-ENERGY (Foil)）">
            <button class="btn-primary" onclick="addCard()">添加卡牌</button>
        </div>

        <div class="toolbar">
            <span>我的收藏（<span id="cardCount">0</span>张）</span>
            <button class="btn-secondary" onclick="refreshPrices()">🔄 刷新价格</button>
        </div>

        <div class="card-list" id="cardList"></div>
    </div>
</div>

<script>
    let token = localStorage.getItem("token");
    let isLogin = true;

    // 初始化
    if (token) showMainPage();

    function toggleAuth() {
        isLogin = !isLogin;
        document.getElementById("authTitle").textContent = isLogin ? "登录" : "注册";
        document.getElementById("email").style.display = isLogin ? "none" : "block";
        document.getElementById("authSwitchText").textContent = isLogin ? "没有账号？" : "已有账号？";
        document.querySelector(".auth-switch a").textContent = isLogin ? "注册" : "登录";
        document.querySelector(".btn-primary").textContent = isLogin ? "登录" : "注册";
    }

    async function submitAuth() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const email = document.getElementById("email").value;

        if (!username || !password) {
            showMessage("请填写用户名和密码", "error", "message");
            return;
        }

        if (isLogin) {
            const formData = new FormData();
            formData.append("username", username);
            formData.append("password", password);
            const res = await fetch("/login", { method: "POST", body: formData });
            const data = await res.json();
            if (data.access_token) {
                localStorage.setItem("token", data.access_token);
                localStorage.setItem("username", username);
                token = data.access_token;
                showMainPage();
            } else {
                showMessage(data.detail || "登录失败", "error", "message");
            }
        } else {
            const formData = new FormData();
            formData.append("username", username);
            formData.append("password", password);
            const res = await fetch(`/register?email=${encodeURIComponent(email)}`, { method: "POST", body: formData });
            const data = await res.json();
            if (data.message === "注册成功") {
                showMessage("注册成功！请登录", "success", "message");
                toggleAuth();
            } else {
                showMessage(data.detail || "注册失败", "error", "message");
            }
        }
    }

    function showMainPage() {
        document.getElementById("authPage").style.display = "none";
        document.getElementById("mainPage").style.display = "block";
        document.getElementById("logoutBtn").style.display = "block";
        const username = localStorage.getItem("username");
        if (username) document.getElementById("usernameDisplay").textContent = `👤 ${username}`;
        loadCards();
    }

    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        token = null;
        document.getElementById("authPage").style.display = "block";
        document.getElementById("mainPage").style.display = "none";
        document.getElementById("logoutBtn").style.display = "none";
        document.getElementById("usernameDisplay").textContent = "";
    }

    async function loadCards() {
        const res = await fetch("/cards", { headers: { "Authorization": `Bearer ${token}` } });
        if (res.status === 401) { logout(); return; }
        const data = await res.json();
        document.getElementById("cardCount").textContent = data.cards.length;
        const list = document.getElementById("cardList");
        list.innerHTML = "";
        data.cards.forEach(card => {
            list.innerHTML += `
                <div class="card-item">
                    <div class="card-info">
                        <h3>${card.name}</h3>
                        <p>提醒价格：${card.alert_price ? "¥ " + card.alert_price : "未设定"}</p>
                    </div>
                    <div class="card-price">${card.last_price || "获取中..."}</div>
                    <div class="card-actions">
                        <div class="alert-input">
                            <input type="number" id="alert_${card.id}" placeholder="${card.alert_price ? '已设定: ¥' + card.alert_price : '提醒价格'}">
                            <button class="btn-secondary" onclick="setAlert(${card.id})">设定</button>
                        </div>
                        <button class="btn-danger" onclick="deleteCard(${card.id})">删除</button>
                    </div>
                </div>`;
        });
    }

    async function addCard() {
        const name = document.getElementById("cardName").value;
        if (!name) { showMessage("请输入卡牌名称", "error", "mainMessage"); return; }
        const res = await fetch(`/cards?name=${encodeURIComponent(name)}`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
            showMessage(`添加成功！当前价格：${data.price}`, "success", "mainMessage");
            document.getElementById("cardName").value = "";
            loadCards();
        } else {
            showMessage(data.message, "error", "mainMessage");
        }
    }

    async function setAlert(id) {
        const price = document.getElementById(`alert_${id}`).value;
        if (!price) { showMessage("请输入提醒价格", "error", "mainMessage"); return; }
        const res = await fetch(`/cards/${id}/alert?alert_price=${price}`, {
            method: "PUT",
            headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
        showMessage("提醒价格设置成功", "success", "mainMessage");
        document.getElementById(`alert_${id}`).value = "";  // 清空输入框
        loadCards();
        }
    }

    async function deleteCard(id) {
        const res = await fetch(`/cards/${id}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
            showMessage("删除成功", "success", "mainMessage");
            loadCards();
        }
    }

    async function refreshPrices() {
        showMessage("正在刷新价格...", "success", "mainMessage");
        const res = await fetch("/refresh", {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
            showMessage("价格刷新成功！", "success", "mainMessage");
            loadCards();
        }
    }

    function showMessage(text, type, id) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = `message ${type}`;
        setTimeout(() => { el.className = "message"; }, 3000);
    }
</script>

</body>
</html>
